<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#071019">

<title>LA RUSTI-K | Administrador</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --negro:#071019;
  --negro2:#0b151e;
  --azul:#2d72ad;
  --azul2:#3c8dcc;
  --amarillo:#f2c300;
  --blanco:#f5f3ea;
  --gris:#c7cbd0;
  --rojo:#d9534f;
  --verde:#36b37e;
  --linea:rgba(231,238,244,.15);
  --sombra:0 18px 50px rgba(0,0,0,.45);
  --radio:16px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at top,
      #132536 0%,
      var(--negro) 55%
    );
  color:var(--blanco);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}


/* =========================================================
   LOGIN
========================================================= */

#pantallaLogin{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:430px;
  background:rgba(11,21,30,.96);
  border:1px solid var(--linea);
  border-radius:24px;
  padding:30px;
  box-shadow:var(--sombra);
}

.login-logo{
  text-align:center;
  margin-bottom:25px;
}

.login-logo img{
  width:170px;
  max-width:80%;
}

.login-logo h1{
  margin:15px 0 5px;
  font-size:30px;
  letter-spacing:1px;
}

.login-logo p{
  margin:0;
  color:var(--gris);
}

label{
  display:block;
  margin:14px 0 7px;
  color:var(--gris);
  font-size:14px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  border:none;
  outline:none;
  background:#111f2b;
  color:var(--blanco);
  border:1px solid var(--linea);
  border-radius:12px;
  padding:13px 14px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--azul2);
}

button{
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.btn-principal{
  width:100%;
  background:var(--amarillo);
  color:#111;
  padding:14px;
  border-radius:12px;
  margin-top:20px;
  font-size:16px;
}

.btn-principal:hover{
  filter:brightness(1.08);
}

.mensaje{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  font-size:14px;
}

.mensaje.error{
  display:block;
  background:rgba(217,83,79,.15);
  color:#ffaaa6;
  border:1px solid rgba(217,83,79,.3);
}

.mensaje.ok{
  display:block;
  background:rgba(54,179,126,.15);
  color:#8ce2ba;
  border:1px solid rgba(54,179,126,.3);
}


/* =========================================================
   ADMIN
========================================================= */

#pantallaAdmin{
  display:none;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(7,16,25,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--linea);
  padding:15px 20px;
}

.topbar-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.marca{
  display:flex;
  align-items:center;
  gap:12px;
}

.marca-icono{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--amarillo);
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.marca h1{
  margin:0;
  font-size:20px;
}

.marca small{
  color:var(--gris);
}

.btn-salir{
  background:#182936;
  color:var(--blanco);
  padding:10px 14px;
  border-radius:10px;
}

.contenedor{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:25px 18px 50px;
}


/* =========================================================
   FORMULARIO
========================================================= */

.panel{
  background:rgba(11,21,30,.94);
  border:1px solid var(--linea);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--sombra);
  margin-bottom:25px;
}

.panel h2{
  margin:0 0 5px;
  font-size:24px;
}

.panel-subtitulo{
  margin:0 0 20px;
  color:var(--gris);
  font-size:14px;
}

.grid-form{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:5px 18px;
}

.campo-completo{
  grid-column:1/-1;
}


/* =========================================================
   IMAGEN
========================================================= */

.imagen-editor{
  margin-top:8px;
}

.input-file{
  display:block;
  width:100%;
  padding:14px;
  border:2px dashed rgba(242,195,0,.35);
  border-radius:14px;
  background:#0e1b25;
  color:var(--gris);
  cursor:pointer;
  text-align:center;
}

.input-file:hover{
  border-color:var(--amarillo);
}

.input-file input{
  display:none;
}

.preview-box{
  margin-top:15px;
  display:none;
}

.preview-box img{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:15px;
  border:1px solid var(--linea);
  display:block;
}

.preview-info{
  margin-top:8px;
  color:var(--gris);
  font-size:12px;
}

.imagen-actual{
  margin-top:15px;
  display:none;
}

.imagen-actual img{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid var(--linea);
}

.imagen-actual p{
  margin:7px 0 0;
  color:var(--gris);
  font-size:12px;
}

.botones-form{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

.btn-guardar{
  background:var(--amarillo);
  color:#111;
  padding:13px 20px;
  border-radius:11px;
}

.btn-cancelar{
  background:#263746;
  color:white;
  padding:13px 20px;
  border-radius:11px;
  display:none;
}


/* =========================================================
   LISTADO
========================================================= */

.lista-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.lista-header h2{
  margin:0;
}

.contador{
  color:var(--gris);
  font-size:14px;
}

.filtros{
  display:grid;
  grid-template-columns:
    1fr 220px;
  gap:12px;
  margin-bottom:20px;
}

.productos{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
  gap:15px;
}

.producto{
  background:#0d1a24;
  border:1px solid var(--linea);
  border-radius:16px;
  overflow:hidden;
}

.producto.inactivo{
  opacity:.55;
}

.producto-img{
  width:100%;
  height:190px;
  background:#09131c;
  display:flex;
  align-items:center;
  justify-content:center;
}

.producto-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.sin-imagen{
  color:#6e7881;
  font-size:13px;
}

.producto-contenido{
  padding:15px;
}

.producto-seccion{
  color:var(--amarillo);
  font-size:11px;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:1px;
}

.producto-nombre{
  margin:5px 0;
  font-size:19px;
}

.producto-precio{
  font-size:20px;
  font-weight:bold;
  color:var(--amarillo);
}

.producto-desc{
  color:var(--gris);
  font-size:13px;
  line-height:1.45;
  margin:8px 0 14px;
}

.estado{
  display:inline-block;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
  margin-bottom:12px;
}

.estado.activo{
  background:rgba(54,179,126,.15);
  color:#80ddb4;
}

.estado.inactivo{
  background:rgba(217,83,79,.15);
  color:#ffaaa6;
}

.acciones{
  display:grid;
  grid-template-columns:
    1fr 1fr;
  gap:8px;
}

.btn-editar{
  background:var(--azul);
  color:white;
  padding:10px;
  border-radius:9px;
}

.btn-toggle{
  background:#263746;
  color:white;
  padding:10px;
  border-radius:9px;
}

.btn-eliminar{
  grid-column:1/-1;
  background:rgba(217,83,79,.16);
  color:#ffaaa6;
  padding:10px;
  border-radius:9px;
}

.cargando{
  text-align:center;
  color:var(--gris);
  padding:40px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  .grid-form{
    grid-template-columns:1fr;
  }

  .campo-completo{
    grid-column:auto;
  }

  .filtros{
    grid-template-columns:1fr;
  }

  .topbar-inner{
    align-items:flex-start;
  }

  .marca h1{
    font-size:17px;
  }

}

</style>

</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="pantallaLogin">

  <div class="login-box">

    <div class="login-logo">

      <img
        src="images/logo-rustik.png"

<!-- =====================================================
     ADMIN
===================================================== -->

<section id="pantallaAdmin">


  <header class="topbar">

    <div class="topbar-inner">

      <div class="marca">

        <div class="marca-icono">

        </div>

          <h1>

          <!-- SECCIÓN -->

              <option value="coffee">

                Sodas

          <option value="">
            Todas las secciones
          </option>

          <option value="burgers">
            Burgers

            Smoothies

          </option>

            Coffee

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://pwtgnmjauhhjtxubqkqh.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable__A0_2nvE94huF4LMJ7K-qw_OREYX48L";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let productos = [];

let productoEditando = null;

let archivoImagenSeleccionado = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const pantallaLogin =
  document.getElementById("pantallaLogin");

const pantallaAdmin =
  document.getElementById("pantallaAdmin");

const formLogin =
  document.getElementById("formLogin");

const mensajeLogin =
  document.getElementById("mensajeLogin");

const formProducto =
  document.getElementById("formProducto");

const mensajeProducto =
  document.getElementById("mensajeProducto");

const listaProductos =
  document.getElementById("listaProductos");

const contadorProductos =
  document.getElementById("contadorProductos");

const buscarProducto =
  document.getElementById("buscarProducto");

const filtroSeccion =
  document.getElementById("filtroSeccion");

const productoImagen =
  document.getElementById("productoImagen");

const previewBox =
  document.getElementById("previewBox");

const previewImagen =
  document.getElementById("previewImagen");

const previewInfo =
  document.getElementById("previewInfo");

const imagenActual =
  document.getElementById("imagenActual");

const imagenActualImg =
  document.getElementById("imagenActualImg");

const imagenActualTexto =
  document.getElementById("imagenActualTexto");

const btnGuardar =
  document.getElementById("btnGuardar");

const btnCancelar =
  document.getElementById("btnCancelar");

const tituloFormulario =
  document.getElementById("tituloFormulario");


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(elemento,texto,tipo){

  elemento.className =
    "mensaje " + tipo;

  elemento.textContent =
    texto;

}

function ocultarMensaje(elemento){

  elemento.className =
    "mensaje";

  elemento.textContent =
    "";

}


/* =========================================================
   LOGIN
========================================================= */

formLogin.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    ocultarMensaje(mensajeLogin);

    const email =
      document.getElementById(
        "loginEmail"
      ).value.trim();

    const password =
      document.getElementById(
        "loginPassword"
      ).value;

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if(error){

      mostrarMensaje(
        mensajeLogin,
        error.message,
        "error"
      );

      return;

    }

    await mostrarAdministrador();

  }
);


/* =========================================================
   SESIÓN
========================================================= */

async function comprobarSesion(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient.auth.getSession();

  if(session){

    await mostrarAdministrador();

  }else{

    mostrarLogin();

  }

}


function mostrarLogin(){

  pantallaLogin.style.display =
    "flex";

  pantallaAdmin.style.display =
    "none";

}


async function mostrarAdministrador(){

  pantallaLogin.style.display =
    "none";

  pantallaAdmin.style.display =
    "block";

  await cargarProductos();

}


/* =========================================================
   CERRAR SESIÓN
========================================================= */

document
  .getElementById("btnSalir")
  .addEventListener(
    "click",
    async function(){

      await supabaseClient.auth.signOut();

      mostrarLogin();

    }
  );


/* =========================================================
   CARGAR PRODUCTOS
========================================================= */

async function cargarProductos(){

  listaProductos.innerHTML =
    '<div class="cargando">Cargando productos...</div>';

  const {
    data,
    error
  } =
    await supabaseClient
      .from("rustik_menu_items")
      .select("*")
      .order("id",{ascending:true});

  if(error){

    listaProductos.innerHTML =
      '<div class="cargando">Error al cargar productos.</div>';

    console.error(error);

    return;

  }

  productos =
    data || [];

  renderProductos();

}


/* =========================================================
   RENDER PRODUCTOS
========================================================= */

function renderProductos(){

  const texto =
    buscarProducto.value
      .trim()
      .toLowerCase();

  const seccion =
    filtroSeccion.value;

  const filtrados =
    productos.filter(
      producto => {

        const coincideTexto =
          !texto ||
          producto.nombre
            .toLowerCase()
            .includes(texto) ||
          (producto.descripcion || "")
            .toLowerCase()
            .includes(texto);

        const coincideSeccion =
          !seccion ||
          producto.seccion === seccion;

        return (
          coincideTexto &&
          coincideSeccion
        );

      }
    );

  contadorProductos.textContent =
    `${filtrados.length} producto(s) mostrado(s) · ${productos.length} total`;


  if(!filtrados.length){

    listaProductos.innerHTML =
      '<div class="cargando">No se encontraron productos.</div>';

    return;

  }


  listaProductos.innerHTML =
    filtrados
      .map(productoCard)
      .join("");

}


/* =========================================================
   TARJETA
========================================================= */

function productoCard(producto){

  const imagen =
    producto.imagen
      ? `
        <img
          src="${escapeHtml(producto.imagen)}"
          alt="${escapeHtml(producto.nombre)}"
          onerror="this.style.display='none';this.parentElement.innerHTML='<div class=&quot;sin-imagen&quot;>Imagen no disponible</div>';"
        >
      `
      :
      `
        <div class="sin-imagen">
          Sin imagen
        </div>
      `;


  const estado =
    producto.activo
      ?
      `
        <span class="estado activo">
          ACTIVO
        </span>
      `
      :
      `
        <span class="estado inactivo">
          INACTIVO
        </span>
      `;


  return `

    <article
      class="producto ${producto.activo ? "" : "inactivo"}"
    >

      <div class="producto-img">
        ${imagen}
      </div>


      <div class="producto-contenido">

        <div class="producto-seccion">
          ${escapeHtml(producto.seccion)}
        </div>

        <div class="producto-nombre">
          ${escapeHtml(producto.nombre)}
        </div>

        <div class="producto-precio">
          $${Number(producto.precio).toFixed(2)}
        </div>

        <div class="producto-desc">
          ${escapeHtml(producto.descripcion || "")}
        </div>

        ${estado}


        <div class="acciones">

          <button
            class="btn-editar"
            onclick="editarProducto(${producto.id})"
          >
            EDITAR
          </button>


          <button
            class="btn-toggle"
            onclick="cambiarActivo(${producto.id})"
          >
            ${producto.activo ? "DESACTIVAR" : "ACTIVAR"}
          </button>


          <button
            class="btn-eliminar"
            onclick="eliminarProducto(${producto.id})"
          >
            ELIMINAR PRODUCTO
          </button>

        </div>

      </div>

    </article>

  `;

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(valor){

  return String(valor ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   SELECCIONAR IMAGEN
========================================================= */

productoImagen.addEventListener(
  "change",
  function(){

    const archivo =
      this.files[0];

    if(!archivo){

      archivoImagenSeleccionado =
        null;

      previewBox.style.display =
        "none";

      return;

    }


    if(!archivo.type.startsWith("image/")){

      mostrarMensaje(
        mensajeProducto,
        "Selecciona una imagen válida.",
        "error"
      );

      this.value =
        "";

      return;

    }


    archivoImagenSeleccionado =
      archivo;


    const lector =
      new FileReader();


    lector.onload =
      function(e){

        previewImagen.src =
          e.target.result;

        previewInfo.textContent =
          `${archivo.name} · ${(archivo.size / 1024 / 1024).toFixed(2)} MB`;

        previewBox.style.display =
          "block";

      };


    lector.readAsDataURL(archivo);

  }
);


/* =========================================================
   SUBIR IMAGEN
========================================================= */

async function subirImagen(archivo){

  if(!archivo){

    return null;

  }


  const extension =
    archivo.name
      .split(".")
      .pop()
      .toLowerCase();


  const nombreSeguro =
    "producto-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,8) +
    "." +
    extension;


  const ruta =
    nombreSeguro;


  const {
    error:uploadError
  } =
    await supabaseClient
      .storage
      .from("rustik-menu")
      .upload(
        ruta,
        archivo,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


  if(uploadError){

    throw uploadError;

  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from("rustik-menu")
      .getPublicUrl(ruta);


  return data.publicUrl;

}


/* =========================================================
   GUARDAR PRODUCTO
========================================================= */

formProducto.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    ocultarMensaje(mensajeProducto);


    const seccion =
      document.getElementById(
        "productoSeccion"
      ).value;

    const nombre =
      document.getElementById(
        "productoNombre"
      ).value.trim();

    const precio =
      Number(
        document.getElementById(
          "productoPrecio"
        ).value
      );

    const descripcion =
      document.getElementById(
        "productoDescripcion"
      ).value.trim();


    if(!nombre){

      mostrarMensaje(
        mensajeProducto,
        "Escribe el nombre del producto.",
        "error"
      );

      return;

    }


    if(isNaN(precio) || precio < 0){

      mostrarMensaje(
        mensajeProducto,
        "Escribe un precio válido.",
        "error"
      );

      return;

    }


    btnGuardar.disabled =
      true;

    btnGuardar.textContent =
      "GUARDANDO...";


    try{

      let imagenURL = null;


      /* ---------------------------------------------
         SI HAY IMAGEN NUEVA
      --------------------------------------------- */

      if(archivoImagenSeleccionado){

        mostrarMensaje(
          mensajeProducto,
          "Subiendo fotografía...",
          "ok"
        );


        imagenURL =
          await subirImagen(
            archivoImagenSeleccionado
          );

      }


      /* ---------------------------------------------
         EDITAR
      --------------------------------------------- */

      if(productoEditando){

        const datosActualizacion = {

          seccion,
          nombre,
          precio,
          descripcion

        };


        if(imagenURL){

          datosActualizacion.imagen =
            imagenURL;

        }


        const {
          error
        } =
          await supabaseClient
            .from("rustik_menu_items")
            .update(
              datosActualizacion
            )
            .eq(
              "id",
              productoEditando.id
            );


        if(error){

          throw error;

        }


        mostrarMensaje(
          mensajeProducto,
          "Producto actualizado correctamente.",
          "ok"
        );

      }

      /* ---------------------------------------------
         NUEVO PRODUCTO
      --------------------------------------------- */

      else{

        const nuevoProducto = {

          seccion,
          nombre,
          precio,
          descripcion,
          imagen:
            imagenURL || "",
          activo:true

        };


        const {
          error
        } =
          await supabaseClient
            .from("rustik_menu_items")
            .insert(
              nuevoProducto
            );


        if(error){

          throw error;

        }


        mostrarMensaje(
          mensajeProducto,
          "Producto agregado correctamente.",
          "ok"
        );

      }


      limpiarFormulario();

      await cargarProductos();

    }
    catch(error){

      console.error(error);

      mostrarMensaje(
        mensajeProducto,
        "No se pudo guardar el producto: " +
        error.message,
        "error"
      );

    }
    finally{

      btnGuardar.disabled =
        false;

      btnGuardar.textContent =
        productoEditando
          ? "GUARDAR CAMBIOS"
          : "GUARDAR PRODUCTO";

    }

  }
);


/* =========================================================
   EDITAR PRODUCTO
========================================================= */

function editarProducto(id){

  const producto =
    productos.find(
      p => Number(p.id) === Number(id)
    );


  if(!producto){

    return;

  }


  productoEditando =
    producto;


  document.getElementById(
    "productoSeccion"
  ).value =
    producto.seccion;


  document.getElementById(
    "productoNombre"
  ).value =
    producto.nombre;


  document.getElementById(
    "productoPrecio"
  ).value =
    producto.precio;


  document.getElementById(
    "productoDescripcion"
  ).value =
    producto.descripcion || "";


  /* ---------------------------------------------
     IMAGEN ACTUAL
  --------------------------------------------- */

  if(producto.imagen){

    imagenActual.style.display =
      "block";

    imagenActualImg.src =
      producto.imagen;

    imagenActualTexto.textContent =
      "Si seleccionas una nueva foto, reemplazará esta imagen.";

  }else{

    imagenActual.style.display =
      "none";

  }


  archivoImagenSeleccionado =
    null;

  productoImagen.value =
    "";

  previewBox.style.display =
    "none";


  tituloFormulario.textContent =
    "Editar producto";


  btnGuardar.textContent =
    "GUARDAR CAMBIOS";


  btnCancelar.style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   CANCELAR EDICIÓN
========================================================= */

btnCancelar.addEventListener(
  "click",
  function(){

    limpiarFormulario();

  }
);


/* =========================================================
   LIMPIAR FORMULARIO
========================================================= */

function limpiarFormulario(){

  productoEditando =
    null;

  archivoImagenSeleccionado =
    null;

  formProducto.reset();

  productoImagen.value =
    "";

  previewBox.style.display =
    "none";

  imagenActual.style.display =
    "none";

  tituloFormulario.textContent =
    "Agregar producto";

  btnGuardar.textContent =
    "GUARDAR PRODUCTO";

  btnCancelar.style.display =
    "none";

}


/* =========================================================
   ACTIVAR / DESACTIVAR
========================================================= */

async function cambiarActivo(id){

  const producto =
    productos.find(
      p => Number(p.id) === Number(id)
    );


  if(!producto){

    return;

  }


  const nuevoEstado =
    !producto.activo;


  const {
    error
  } =
    await supabaseClient
      .from("rustik_menu_items")
      .update({
        activo:nuevoEstado
      })
      .eq(
        "id",
        id
      );


  if(error){

    alert(
      "No se pudo cambiar el estado:\n" +
      error.message
    );

    return;

  }


  await cargarProductos();

}


/* =========================================================
   ELIMINAR PRODUCTO
========================================================= */

async function eliminarProducto(id){

  const producto =
    productos.find(
      p => Number(p.id) === Number(id)
    );


  if(!producto){

    return;

  }


  const confirmar =
    confirm(
      `¿Eliminar "${producto.nombre}"?\n\nEsta acción no se puede deshacer.`
    );


  if(!confirmar){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("rustik_menu_items")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    alert(
      "No se pudo eliminar:\n" +
      error.message
    );

    return;

  }


  await cargarProductos();

}

   BUSCAR
========================================================= */

buscarProducto.addEventListener(
  "input",
  renderProductos
);

filtroSeccion.addEventListener(
  "change",
  renderProductos
);


/* =========================================================
   INICIAR

comprobarSesion();
