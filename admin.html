<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#071019">

<title>LA RUSTI-K | Administración</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat+Brush&family=Oswald:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{

  --negro:#071019;
  --negro2:#0b151e;
  --azul:#2d72ad;
  --azul2:#3c8dcc;
  --amarillo:#f2c300;
  --blanco:#f5f3ea;
  --gris:#c7cbd0;
  --rojo:#d94b4b;
  --verde:#3aa76d;

  --linea:rgba(231,238,244,.16);

  --sombra:0 18px 50px rgba(0,0,0,.45);

  --radio:16px;

}

*{
  box-sizing:border-box;
}

body{

  margin:0;

  background:
    radial-gradient(
      circle at top,
      rgba(45,114,173,.22),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #071019,
      #050b10
    );

  color:var(--blanco);

  font-family:'Oswald',sans-serif;

  min-height:100vh;

}

button,
input,
textarea,
select{

  font:inherit;

}


/* =========================================================
   LOGIN
========================================================= */

#loginView{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:24px;

}

.login-box{

  width:100%;

  max-width:430px;

  background:
    linear-gradient(
      145deg,
      rgba(18,32,43,.97),
      rgba(7,16,25,.97)
    );

  border:1px solid var(--linea);

  border-radius:24px;

  padding:32px 24px;

  box-shadow:var(--sombra);

  text-align:center;

}

.logo-admin{

  width:92px;

  height:92px;

  object-fit:contain;

  margin-bottom:12px;

}

.login-title{

  font-family:'Bebas Neue',sans-serif;

  font-size:42px;

  letter-spacing:1px;

  margin:0;

}

.login-subtitle{

  color:var(--amarillo);

  font-family:'Caveat Brush',cursive;

  font-size:24px;

  margin:0 0 25px;

}

.form-group{

  text-align:left;

  margin-bottom:16px;

}

.form-group label{

  display:block;

  margin-bottom:7px;

  color:var(--gris);

  font-size:14px;

}

input,
textarea,
select{

  width:100%;

  border:1px solid rgba(255,255,255,.12);

  background:#101c26;

  color:white;

  border-radius:12px;

  padding:13px 14px;

  outline:none;

}

input:focus,
textarea:focus,
select:focus{

  border-color:var(--azul2);

}

textarea{

  min-height:90px;

  resize:vertical;

}

.btn{

  width:100%;

  border:none;

  border-radius:13px;

  padding:14px 18px;

  cursor:pointer;

  font-weight:700;

  transition:.2s;

}

.btn:hover{

  transform:translateY(-1px);

}

.btn-primary{

  background:var(--amarillo);

  color:#111;

}

.btn-blue{

  background:var(--azul);

  color:white;

}

.btn-danger{

  background:var(--rojo);

  color:white;

}

.btn-success{

  background:var(--verde);

  color:white;

}

.error{

  margin-top:15px;

  color:#ff7777;

  font-size:14px;

  min-height:20px;

}


/* =========================================================
   ADMIN
========================================================= */

#adminView{

  display:none;

  min-height:100vh;

}

.topbar{

  position:sticky;

  top:0;

  z-index:20;

  background:rgba(7,16,25,.95);

  backdrop-filter:blur(12px);

  border-bottom:1px solid var(--linea);

  padding:15px;

}

.topbar-inner{

  max-width:1100px;

  margin:auto;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

}

.brand{

  display:flex;

  align-items:center;

  gap:12px;

}

.brand img{

  width:48px;

  height:48px;

  object-fit:contain;

}

.brand-title{

  font-family:'Bebas Neue',sans-serif;

  font-size:28px;

  line-height:1;

}

.brand-sub{

  color:var(--amarillo);

  font-size:13px;

}

.logout{

  width:auto;

  padding:10px 15px;

  background:#182632;

  color:white;

}


/* =========================================================
   CONTENEDOR
========================================================= */

.container{

  max-width:1100px;

  margin:auto;

  padding:25px 15px 50px;

}

.page-title{

  margin-bottom:22px;

}

.page-title h1{

  font-family:'Bebas Neue',sans-serif;

  font-size:38px;

  margin:0;

}

.page-title p{

  color:var(--gris);

  margin:5px 0 0;

}


/* =========================================================
   FORMULARIO
========================================================= */

.panel{

  background:
    linear-gradient(
      145deg,
      rgba(15,29,40,.96),
      rgba(8,17,25,.96)
    );

  border:1px solid var(--linea);

  border-radius:20px;

  padding:20px;

  box-shadow:var(--sombra);

  margin-bottom:25px;

}

.panel-title{

  font-family:'Bebas Neue',sans-serif;

  font-size:27px;

  margin:0 0 18px;

  color:var(--amarillo);

}

.grid{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:15px;

}

.full{

  grid-column:1 / -1;

}

.actions{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-top:15px;

}

.actions .btn{

  width:auto;

}

.hidden{

  display:none !important;

}


/* =========================================================
   PRODUCTOS
========================================================= */

.list-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:15px;

}

.list-header h2{

  font-family:'Bebas Neue',sans-serif;

  font-size:30px;

  margin:0;

}

.count{

  color:var(--gris);

  font-size:14px;

}

.products{

  display:grid;

  gap:12px;

}

.product{

  display:flex;

  align-items:center;

  gap:15px;

  background:#0d1a24;

  border:1px solid var(--linea);

  border-radius:16px;

  padding:13px;

}

.product.inactive{

  opacity:.5;

}

.product-image{

  width:82px;

  height:82px;

  flex:0 0 82px;

  border-radius:12px;

  object-fit:cover;

  background:#111;

}

.no-image{

  display:flex;

  align-items:center;

  justify-content:center;

  color:#777;

  font-size:11px;

  text-align:center;

}

.product-info{

  flex:1;

  min-width:0;

}

.product-name{

  font-family:'Bebas Neue',sans-serif;

  font-size:24px;

  line-height:1;

}

.product-section{

  display:inline-block;

  margin-top:5px;

  color:var(--amarillo);

  font-size:12px;

  text-transform:uppercase;

}

.product-description{

  color:var(--gris);

  font-size:13px;

  margin-top:5px;

}

.product-price{

  color:white;

  font-size:20px;

  font-weight:700;

  margin-top:7px;

}

.product-actions{

  display:flex;

  flex-direction:column;

  gap:7px;

  width:115px;

}

.product-actions button{

  border:none;

  border-radius:9px;

  padding:8px 10px;

  cursor:pointer;

  color:white;

  font-size:13px;

}

.edit{

  background:var(--azul);

}

.toggle{

  background:#33424d;

}

.delete{

  background:var(--rojo);

}


/* =========================================================
   MENSAJES
========================================================= */

.status{

  position:fixed;

  left:50%;

  bottom:22px;

  transform:
    translateX(-50%)
    translateY(120px);

  z-index:100;

  background:#111d27;

  border:1px solid var(--linea);

  border-radius:12px;

  padding:13px 18px;

  box-shadow:var(--sombra);

  transition:.25s;

  opacity:0;

}

.status.show{

  transform:
    translateX(-50%)
    translateY(0);

  opacity:1;

}

.status.success{

  border-color:rgba(58,167,109,.6);

}

.status.error{

  border-color:rgba(217,75,75,.6);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .grid{

    grid-template-columns:1fr;

  }

  .full{

    grid-column:auto;

  }

  .topbar-inner{

    align-items:flex-start;

  }

  .product{

    align-items:flex-start;

  }

  .product-image{

    width:65px;

    height:65px;

    flex-basis:65px;

  }

  .product-actions{

    width:90px;

  }

  .product-actions button{

    font-size:11px;

    padding:7px 5px;

  }

  .product-name{

    font-size:20px;

  }

}

</style>

</head>

<body>


<!-- =========================================================
     LOGIN
========================================================= -->

<section id="loginView">

  <div class="login-box">

    <img
      src="images/logo-rustik.png"
      class="logo-admin"
      alt="LA RUSTI-K"
    >

    <h1 class="login-title">
      LA RUSTI-K
    </h1>

    <div class="login-subtitle">
      Administración
    </div>

    <form id="loginForm">

      <div class="form-group">

        <label>
          Correo electrónico
        </label>

        <input
          type="email"
          id="email"
          required
          autocomplete="email"
          placeholder="admin@larustik.com"
        >

      </div>

      <div class="form-group">

        <label>
          Contraseña
        </label>

        <input
          type="password"
          id="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
        >

      </div>

      <button
        type="submit"
        class="btn btn-primary"
      >
        ENTRAR COMO ADMINISTRADOR
      </button>

    </form>

    <div
      id="loginError"
      class="error"
    ></div>

  </div>

</section>


<!-- =========================================================
     ADMIN
========================================================= -->

<section id="adminView">

  <header class="topbar">

    <div class="topbar-inner">

      <div class="brand">

        <img
          src="images/logo-rustik.png"
          alt="LA RUSTI-K"
        >

        <div>

          <div class="brand-title">
            LA RUSTI-K
          </div>

          <div class="brand-sub">
            Panel de administración
          </div>

        </div>

      </div>

      <button
        class="btn logout"
        id="logoutBtn"
      >
        CERRAR SESIÓN
      </button>

    </div>

  </header>


  <main class="container">

    <div class="page-title">

      <h1>
        MENÚ
      </h1>

      <p>
        Administra los productos que aparecen en LA RUSTI-K Food.
      </p>

    </div>


    <!-- =====================================================
         FORMULARIO
    ====================================================== -->

    <section class="panel">

      <h2
        class="panel-title"
        id="formTitle"
      >
        AGREGAR PRODUCTO
      </h2>

      <form id="productForm">

        <input
          type="hidden"
          id="productId"
        >

        <div class="grid">

          <div class="form-group">

            <label>
              Sección
            </label>

            <select id="seccion" required>

              <option value="burgers">
                Burgers
              </option>

              <option value="snacks">
                Snacks
              </option>

              <option value="meats">
                Carnes y Costillas
              </option>

              <option value="extras">
                Extras
              </option>

              <option value="desserts">
                Postres
              </option>

              <option value="smoothies">
                Smoothies
              </option>

              <option value="frappes">
                Frappés
              </option>

              <option value="malteadas">
                Malteadas
              </option>

              <option value="coffee">
                Coffee
              </option>

              <option value="tes">
                Tés
              </option>

              <option value="sodas">
                Sodas
              </option>

              <option value="specials">
                Especiales
              </option>

            </select>

          </div>


          <div class="form-group">

            <label>
              Nombre del producto
            </label>

            <input
              type="text"
              id="nombre"
              required
              placeholder="Ej. Double Smash"
            >

          </div>


          <div class="form-group">

            <label>
              Precio
            </label>

            <input
              type="number"
              id="precio"
              min="0"
              step="0.01"
              required
              placeholder="189"
            >

          </div>


          <div class="form-group">

            <label>
              Ruta de imagen
            </label>

            <input
              type="text"
              id="imagen"
              placeholder="images/productos/double-smash.jpg"
            >

          </div>


          <div class="form-group full">

            <label>
              Descripción
            </label>

            <textarea
              id="descripcion"
              placeholder="Descripción del producto..."
            ></textarea>

          </div>

        </div>


        <div class="actions">

          <button
            type="submit"
            class="btn btn-primary"
            id="saveBtn"
          >
            GUARDAR PRODUCTO
          </button>

          <button
            type="button"
            class="btn btn-blue hidden"
            id="cancelBtn"
          >
            CANCELAR EDICIÓN
          </button>

        </div>

      </form>

    </section>


    <!-- =====================================================
         LISTA
    ====================================================== -->

    <section class="panel">

      <div class="list-header">

        <div>

          <h2>
            PRODUCTOS
          </h2>

          <div
            class="count"
            id="productCount"
          >
            Cargando...
          </div>

        </div>

      </div>

      <div
        class="products"
        id="productsList"
      ></div>

    </section>

  </main>

</section>


<div
  id="status"
  class="status"
></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://pwtgnmjauhhjtxubqkqh.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable__A0_2nvE94huF4LMJ7K-qw_OREYX48L";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   ELEMENTOS
========================================================= */

const loginView =
  document.getElementById("loginView");

const adminView =
  document.getElementById("adminView");

const loginForm =
  document.getElementById("loginForm");

const loginError =
  document.getElementById("loginError");

const logoutBtn =
  document.getElementById("logoutBtn");

const productForm =
  document.getElementById("productForm");

const productId =
  document.getElementById("productId");

const seccion =
  document.getElementById("seccion");

const nombre =
  document.getElementById("nombre");

const precio =
  document.getElementById("precio");

const descripcion =
  document.getElementById("descripcion");

const imagen =
  document.getElementById("imagen");

const productsList =
  document.getElementById("productsList");

const productCount =
  document.getElementById("productCount");

const formTitle =
  document.getElementById("formTitle");

const saveBtn =
  document.getElementById("saveBtn");

const cancelBtn =
  document.getElementById("cancelBtn");

const statusBox =
  document.getElementById("status");


/* =========================================================
   MENSAJE
========================================================= */

function mostrarMensaje(
  mensaje,
  tipo="success"
){

  statusBox.textContent =
    mensaje;

  statusBox.className =
    "status show " + tipo;

  setTimeout(()=>{

    statusBox.className =
      "status";

  },3000);

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    loginError.textContent =
      "";

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });

    if(error){

      console.error(error);

      loginError.textContent =
        "Correo o contraseña incorrectos.";

      return;

    }

    mostrarAdmin();

  }
);


/* =========================================================
   SESIÓN
========================================================= */

async function comprobarSesion(){

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();

  if(
    data &&
    data.session
  ){

    mostrarAdmin();

  }else{

    mostrarLogin();

  }

}


function mostrarLogin(){

  loginView.style.display =
    "flex";

  adminView.style.display =
    "none";

}


function mostrarAdmin(){

  loginView.style.display =
    "none";

  adminView.style.display =
    "block";

  cargarProductos();

}


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
  "click",
  async function(){

    await supabaseClient.auth.signOut();

    mostrarLogin();

  }
);


/* =========================================================
   CARGAR PRODUCTOS
========================================================= */

async function cargarProductos(){

  productsList.innerHTML =
    "<p>Cargando productos...</p>";

  const {
    data,
    error
  } =
    await supabaseClient
      .from("rustik_menu_items")
      .select("*")
      .order(
        "id",
        {
          ascending:true
        }
      );

  if(error){

    console.error(error);

    productsList.innerHTML =
      "<p>No se pudieron cargar los productos.</p>";

    productCount.textContent =
      "Error";

    return;

  }

  productCount.textContent =
    data.length +
    " producto" +
    (
      data.length === 1
        ? ""
        : "s"
    );

  if(!data.length){

    productsList.innerHTML = `

      <p style="
        color:#c7cbd0;
        text-align:center;
        padding:25px;
      ">

        Todavía no hay productos.
        <br>
        Agrega el primero arriba.

      </p>

    `;

    return;

  }

  productsList.innerHTML =
    data
      .map(producto =>
        crearProductoHTML(producto)
      )
      .join("");

}


/* =========================================================
   HTML PRODUCTO
========================================================= */

function crearProductoHTML(
  producto
){

  const imagenHTML =
    producto.imagen
      ? `

        <img
          class="product-image"
          src="${escapeHTML(producto.imagen)}"
          alt="${escapeHTML(producto.nombre)}"
          onerror="this.outerHTML='<div class=&quot;product-image no-image&quot;>SIN IMAGEN</div>'"
        >

      `
      : `

        <div class="product-image no-image">
          SIN IMAGEN
        </div>

      `;


  return `

    <article
      class="product ${
        producto.activo
          ? ""
          : "inactive"
      }"
    >

      ${imagenHTML}

      <div class="product-info">

        <div class="product-name">

          ${escapeHTML(producto.nombre)}

        </div>

        <div class="product-section">

          ${escapeHTML(producto.seccion)}

        </div>

        <div class="product-description">

          ${
            escapeHTML(
              producto.descripcion || ""
            )
          }

        </div>

        <div class="product-price">

          $${Number(producto.precio).toFixed(2)}

        </div>

      </div>


      <div class="product-actions">

        <button
          class="edit"
          onclick="editarProducto(${producto.id})"
        >
          EDITAR
        </button>

        <button
          class="toggle"
          onclick="
            cambiarEstado(
              ${producto.id},
              ${producto.activo}
            )
          "
        >

          ${
            producto.activo
              ? "DESACTIVAR"
              : "ACTIVAR"
          }

        </button>

        <button
          class="delete"
          onclick="
            eliminarProducto(
              ${producto.id}
            )
          "
        >
          ELIMINAR
        </button>

      </div>

    </article>

  `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
  valor
){

  return String(valor ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   AGREGAR / EDITAR
========================================================= */

productForm.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    const id =
      productId.value;

    const producto = {

      seccion:
        seccion.value,

      nombre:
        nombre.value.trim(),

      precio:
        Number(precio.value),

      descripcion:
        descripcion.value.trim(),

      imagen:
        imagen.value.trim()

    };


    if(
      !producto.nombre ||
      Number.isNaN(producto.precio)
    ){

      mostrarMensaje(
        "Completa nombre y precio.",
        "error"
      );

      return;

    }


    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "GUARDANDO...";


    let resultado;


    if(id){

      resultado =
        await supabaseClient
          .from("rustik_menu_items")
          .update(producto)
          .eq(
            "id",
            id
          );

    }else{

      resultado =
        await supabaseClient
          .from("rustik_menu_items")
          .insert({

            ...producto,

            activo:true

          });

    }


    if(resultado.error){

      console.error(
        resultado.error
      );

      mostrarMensaje(
        "No se pudo guardar el producto.",
        "error"
      );

    }else{

      mostrarMensaje(
        id
          ? "Producto actualizado."
          : "Producto agregado."
      );

      limpiarFormulario();

      cargarProductos();

    }


    saveBtn.disabled =
      false;

    saveBtn.textContent =
      "GUARDAR PRODUCTO";

  }
);


/* =========================================================
   EDITAR PRODUCTO
========================================================= */

async function editarProducto(
  id
){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("rustik_menu_items")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();


  if(error){

    console.error(error);

    mostrarMensaje(
      "No se pudo cargar el producto.",
      "error"
    );

    return;

  }


  productId.value =
    data.id;

  seccion.value =
    data.seccion;

  nombre.value =
    data.nombre;

  precio.value =
    data.precio;

  descripcion.value =
    data.descripcion || "";

  imagen.value =
    data.imagen || "";


  formTitle.textContent =
    "EDITAR PRODUCTO";

  saveBtn.textContent =
    "ACTUALIZAR PRODUCTO";

  cancelBtn.classList.remove(
    "hidden"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   CANCELAR EDICIÓN
========================================================= */

cancelBtn.addEventListener(
  "click",
  limpiarFormulario
);


function limpiarFormulario(){

  productForm.reset();

  productId.value =
    "";

  seccion.value =
    "burgers";

  formTitle.textContent =
    "AGREGAR PRODUCTO";

  saveBtn.textContent =
    "GUARDAR PRODUCTO";

  cancelBtn.classList.add(
    "hidden"
  );

}


/* =========================================================
   ACTIVAR / DESACTIVAR
========================================================= */

async function cambiarEstado(
  id,
  estadoActual
){

  const {
    error
  } =
    await supabaseClient
      .from("rustik_menu_items")
      .update({

        activo:
          !estadoActual

      })
      .eq(
        "id",
        id
      );


  if(error){

    console.error(error);

    mostrarMensaje(
      "No se pudo cambiar el estado.",
      "error"
    );

    return;

  }


  mostrarMensaje(
    estadoActual
      ? "Producto desactivado."
      : "Producto activado."
  );

  cargarProductos();

}


/* =========================================================
   ELIMINAR
========================================================= */

async function eliminarProducto(
  id
){

  const confirmar =
    confirm(
      "¿Seguro que quieres eliminar este producto?"
    );


  if(!confirmar){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("rustik_menu_items")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    console.error(error);

    mostrarMensaje(
      "No se pudo eliminar el producto.",
      "error"
    );

    return;

  }


  mostrarMensaje(
    "Producto eliminado."
  );

  cargarProductos();

}


/* =========================================================
   INICIAR
========================================================= */

comprobarSesion();

</script>
